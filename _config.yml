
# ==========================================================================
# Basic Site Settings
# ==========================================================================

locale                   : "en-US"
title                    : "Zakia Hossain | Applied Mathematics"
title_separator          : "-"
name                     : &name "Zakia Hossain"
description              : &description "Academic website of Zakia Hossain, focusing on applied mathematics, mathematical modeling, and computational mathematics."
url                      : "https://zakia-hossain.github.io"
baseurl                  : ""
repository               : "zakia-hossain/zakia-hossain.github.io"

# ==========================================================================
# Site Author
# ==========================================================================

author:
  avatar           : "zakia.jpg"
  name             : "Zakia Hossain"
  pronouns         :
  bio              : "PhD Candidate | Applied Mathematics"
  location         : "Albuquerque, New Mexico"
  employer         : "University of New Mexico"
  uri              :
  email            : "zakia@unm.edu"

  # Academic profiles
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=5u9o6msAAAAJ&hl=en"
  impactstory      :
  orcid            :
  semantic         :
  pubmed           :
  researchgate     :
  scopus           :

  # Repositories
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "zakia-hossain"
  kaggle           :
  stackoverflow    :

  # Social media
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         :
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :

# ==========================================================================
# Publication Categories
# ==========================================================================

publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

# ==========================================================================
# Site Settings
# ==========================================================================

teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :

staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"

atom_feed:
  hide                   : false
  path                   :

# ==========================================================================
# SEO
# ==========================================================================

google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# ==========================================================================
# Social Sharing
# ==========================================================================

twitter:
  username               : &twitter

facebook:
  username               :
  app_id                 :
  publisher              :

og_image                 :

social:
  type                   :
  name                   :
  links:

# ==========================================================================
# Analytics
# ==========================================================================

analytics:
  provider               : "false"
  google:
    tracking_id          :

# ==========================================================================
# Reading Files
# ==========================================================================

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ==========================================================================
# Conversion
# ==========================================================================

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# ==========================================================================
# Markdown Processing
# ==========================================================================

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ==========================================================================
# Collections
# ==========================================================================

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# ==========================================================================
# Defaults
# ==========================================================================

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# ==========================================================================
# Sass / SCSS
# ==========================================================================

sass:
  sass_dir: _sass
  style: compressed

# ==========================================================================
# Output
# ==========================================================================

permalink: /:categories/:title/
timezone: Etc/UTC

# ==========================================================================
# Plugins
# ==========================================================================

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# ==========================================================================
# Archives
# ==========================================================================

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# ==========================================================================
# HTML Compression
# ==========================================================================

compress_html:
  clippings: all
  ignore:
    envs: development
